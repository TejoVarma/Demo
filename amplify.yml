# AWS Amplify build settings (monorepo: the app lives in frontend/).
# In the Amplify console, set the environment variable AMPLIFY_MONOREPO_APP_ROOT=frontend.
# Rewrites are configured in the console (Hosting → Rewrites and redirects); see frontend/README.md.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm test
            - pnpm build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
